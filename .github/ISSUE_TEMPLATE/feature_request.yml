name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便，或者想做到什么
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      description: 希望它怎么工作；有参考的软件或截图更好
  - type: textarea
    id: extra
    attributes:
      label: 其他
      description: 愿不愿意自己提交 PR、相关链接等
